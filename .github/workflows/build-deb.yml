name: Compile Latest DDRescue-GUI DEB Package

on:
  workflow_dispatch:

jobs:
  compile_package:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04

    steps:
      - name: Bootstrap Essential Package System Tools
        run: |
          apt-get update
          apt-get install -y git python3-all python3-setuptools python3-wxgtk4.0 checkinstall gddrescue

      - name: Fetch Upstream Source Code Base
        run: |
          git clone https://gitlab.com/hamishmb/ddrescue-gui.git

      - name: Manual File Architecture Staging Pass
        run: |
          cd ddrescue-gui
          # Create native system layout directories inside a temporary build root
          mkdir -p build_root/usr/share/ddrescue-gui
          mkdir -p build_root/usr/bin

          # Copy the raw python program components into the system asset share
          cp -r ddrescue_gui/* build_root/usr/share/ddrescue-gui/
          cp -r cd_classes build_root/usr/share/ddrescue-gui/
          cp *.py build_root/usr/share/ddrescue-gui/

          # Create a direct executable system symlink to launch the main script
          echo -e '#!/bin/bash\npython3 /usr/share/ddrescue-gui/main.py "$@"' > build_root/usr/bin/ddrescue-gui
          chmod +x build_root/usr/bin/ddrescue-gui

      - name: Execute Checkinstall Framework Package Wrap
        run: |
          cd ddrescue-gui
          # Wrap the staged filesystem directly into a pristine native installer wrapper
          checkinstall --pkgname=ddrescue-gui-custom \
                       --pkgversion=2.2.0 \
                       --pkgrelease=1 \
                       --pkggroup=utils \
                       --maintainer="rudder2" \
                       --requires="python3,python3-wxgtk4.0,gddrescue" \
                       --nodoc -y --intrac_at_end=no

          # Move the compiled deb package up so the artifact uploader can grab it
          mv *.deb ddrescue-gui-custom_2.2.0-1_amd64.deb

      - name: Export Output Production Installer Asset
        uses: actions/upload-artifact@v4
        with:
          name: ddrescue-gui-custom-package
          path: ddrescue-gui/*.deb
